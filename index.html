<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Car Care" />
  <title>Car Care</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --oil: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 0);
    }
    .app { max-width: 420px; margin: 0 auto; padding: 20px 16px 60px; }
    .header { margin-bottom: 28px; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .title { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .settings-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
    }
    .mileage-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px; margin-bottom: 20px;
    }
    .mileage-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
    .mileage-num { font-size: 42px; font-weight: 600; letter-spacing: -1px; font-family: 'DM Mono', monospace; line-height: 1; }
    .mileage-num span { font-size: 20px; color: var(--muted); font-weight: 400; }
    .mileage-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; }
    .mileage-stat-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .mileage-stat-val { font-size: 15px; font-weight: 500; font-family: 'DM Mono', monospace; }
    .update-btn {
      background: var(--oil); color: #000; border: none;
      border-radius: 12px; padding: 8px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 12px; }
    .service-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 18px; margin-bottom: 10px;
    }
    .service-card.status-warn { border-color: rgba(245,158,11,0.5); }
    .service-card.status-danger { border-color: rgba(239,68,68,0.6); }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .card-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .icon-oil { background: rgba(245,158,11,0.15); }
    .icon-filter { background: rgba(16,185,129,0.15); }
    .icon-tire { background: rgba(59,130,246,0.15); }
    .card-info { flex: 1; }
    .card-name { font-size: 15px; font-weight: 600; }
    .card-due { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .card-badge { font-size: 11px; font-weight: 600; border-radius: 20px; padding: 4px 10px; font-family: 'DM Mono', monospace; }
    .badge-ok { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge-warn { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-danger { background: rgba(239,68,68,0.15); color: #ef4444; }
    .progress-track { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
    .fill-ok { background: #10b981; }
    .fill-warn { background: #f59e0b; }
    .fill-danger { background: #ef4444; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .weeks-label { font-size: 12px; color: var(--muted); }
    .miles-left { font-size: 13px; font-weight: 500; font-family: 'DM Mono', monospace; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: flex-end; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 24px 20px 48px; width: 100%;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      border: 1px solid var(--border);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .modal-field { margin-bottom: 16px; }
    .modal-field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'DM Mono', monospace; display: block; margin-bottom: 6px; }
    .modal-field input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      font-size: 18px; font-family: 'DM Mono', monospace; color: var(--text); outline: none;
    }
    .modal-field input:focus { border-color: var(--oil); }
    .save-btn {
      width: 100%; background: var(--oil); color: #000; border: none;
      border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .info-row { display: flex; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-top: 20px; }
    .info-item-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 3px; }
    .info-item-val { font-size: 14px; font-weight: 500; font-family: 'DM Mono', monospace; }
    .footer-note { text-align: center; font-size: 12px; color: #555; margin-top: 24px; font-family: 'DM Mono', monospace; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="title">Mini Cooper</div>
        <div class="subtitle">Maintenance Tracker</div>
      </div>
      <button class="settings-btn" onclick="openModal()">⚙</button>
    </div>
  </div>

  <div class="mileage-card">
    <div class="mileage-label">Current Mileage</div>
    <div class="mileage-num" id="display-mileage">56,949 <span>mi</span></div>
    <div class="mileage-row">
      <div>
        <div class="mileage-stat-label">Weekly avg</div>
        <div class="mileage-stat-val">120 mi/wk</div>
      </div>
      <div style="text-align:right;">
        <div class="mileage-stat-label">Next service</div>
        <div class="mileage-stat-val" id="next-service-miles">—</div>
      </div>
      
    </div>
  </div>

  <div class="section-label">Service Reminders</div>

  <div class="service-card" id="card-oil">
    <div class="card-top">
      <div class="card-icon icon-oil">🛢️</div>
      <div class="card-info">
        <div class="card-name">Engine Oil</div>
        <div class="card-due" id="due-oil">—</div>
      </div>
      <span class="card-badge" id="badge-oil">—</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar-oil" style="width:0%"></div></div>
    <div class="card-footer">
      <span class="weeks-label" id="weeks-oil">—</span>
      <span class="miles-left" id="milesleft-oil">—</span>
    </div>
  </div>

  <div class="service-card" id="card-filter">
    <div class="card-top">
      <div class="card-icon icon-filter">🔩</div>
      <div class="card-info">
        <div class="card-name">Oil Filter</div>
        <div class="card-due" id="due-filter">—</div>
      </div>
      <span class="card-badge" id="badge-filter">—</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar-filter" style="width:0%"></div></div>
    <div class="card-footer">
      <span class="weeks-label" id="weeks-filter">—</span>
      <span class="miles-left" id="milesleft-filter">—</span>
    </div>
  </div>

  <div class="service-card" id="card-tire">
    <div class="card-top">
      <div class="card-icon icon-tire">🔄</div>
      <div class="card-info">
        <div class="card-name">Tire Rotation</div>
        <div class="card-due" id="due-tire">—</div>
      </div>
      <span class="card-badge" id="badge-tire">—</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar-tire" style="width:0%"></div></div>
    <div class="card-footer">
      <span class="weeks-label" id="weeks-tire">—</span>
      <span class="miles-left" id="milesleft-tire">—</span>
    </div>
  </div>

  <div class="info-row">
    <div class="info-item">
      <div class="info-item-label">Last Service</div>
      <div class="info-item-val" id="info-last-service">4/25/2026</div>
    </div>
    <div class="info-item" style="text-align:center;">
      <div class="info-item-label">At Mileage</div>
      <div class="info-item-val" id="info-last-mileage">56,949</div>
    </div>
    <div class="info-item" style="text-align:right;">
      <div class="info-item-label">Interval</div>
      <div class="info-item-val">7,000 mi</div>
    </div>
  </div>

  <div class="footer-note">⚠ reminder zone starts 500 mi before due</div>
</div>

<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Update Details</div>
    <div class="modal-field">
      <label>Current Mileage</label>
      <input type="number" id="input-mileage" inputmode="numeric" placeholder="56949" />
    </div>
    <div class="modal-field">
      <label>Last Service Date</label>
      <input type="date" id="input-date" />
    </div>
    <div class="modal-field">
      <label>Mileage at Last Service</label>
      <input type="number" id="input-service-mileage" inputmode="numeric" placeholder="56949" />
    </div>
    <button class="save-btn" onclick="saveData()">Save & Update</button>
  </div>
</div>

<script>
  const INTERVAL = 7000, WEEKLY = 120, WARN_ZONE = 500;
  const DEFAULTS = { mileage: 56949, serviceMileage: 56949, serviceDate: '2026-04-25' };

  function load() {
    try { return JSON.parse(localStorage.getItem('carcare') || 'null') || DEFAULTS; }
    catch(e) { return DEFAULTS; }
  }
  function persist(d) { try { localStorage.setItem('carcare', JSON.stringify(d)); } catch(e) {} }
  function fmt(n) { return Number(n).toLocaleString(); }

  function getStatus(ml) {
    if (ml <= 0) return { cls:'danger', badge:'Overdue', barCls:'fill-danger', cardCls:'status-danger' };
    if (ml <= WARN_ZONE) return { cls:'warn', badge:'Soon!', barCls:'fill-warn', cardCls:'status-warn' };
    return { cls:'ok', badge:'Good', barCls:'fill-ok', cardCls:'status-ok' };
  }

  function weeksLabel(ml) {
    if (ml <= 0) return 'Past due!';
    const w = Math.ceil(ml / WEEKLY);
    return w === 1 ? '~1 week away' : `~${w} weeks away`;
  }

  function updateCard(id, dueAt, cur) {
    const ml = dueAt - cur;
    const pct = Math.min(100, Math.max(0, Math.round(((INTERVAL - ml) / INTERVAL) * 100)));
    const st = getStatus(ml);
    document.getElementById('due-' + id).textContent = 'Due at ' + fmt(dueAt) + ' mi';
    const badge = document.getElementById('badge-' + id);
    badge.textContent = st.badge; badge.className = 'card-badge badge-' + st.cls;
    const bar = document.getElementById('bar-' + id);
    bar.style.width = pct + '%'; bar.className = 'progress-fill ' + st.barCls;
    document.getElementById('weeks-' + id).textContent = weeksLabel(ml);
    document.getElementById('milesleft-' + id).textContent = ml > 0 ? fmt(ml) + ' mi left' : 'Overdue';
    document.getElementById('card-' + id).className = 'service-card ' + st.cardCls;
  }

  function render() {
    const d = load();
    document.getElementById('display-mileage').innerHTML = fmt(d.mileage) + ' <span>mi</span>';
    if (d.serviceDate) {
      const dt = new Date(d.serviceDate + 'T12:00:00');
      document.getElementById('info-last-service').textContent = dt.toLocaleDateString('en-US');
    }
    document.getElementById('info-last-mileage').textContent = fmt(d.serviceMileage);
    const dueAt = d.serviceMileage + INTERVAL;
    ['oil','filter','tire'].forEach(id => updateCard(id, dueAt, d.mileage));
    const ml = dueAt - d.mileage;
    document.getElementById('next-service-miles').textContent = ml > 0 ? fmt(ml) + ' mi away' : 'Overdue!';
  }

  function openModal() {
    const d = load();
    document.getElementById('input-mileage').value = d.mileage;
    document.getElementById('input-date').value = d.serviceDate || '';
    document.getElementById('input-service-mileage').value = d.serviceMileage;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }
  function handleOverlayClick(e) { if (e.target.id === 'modal') closeModal(); }

  function saveData() {
    const d = load();
    const mi = parseInt(document.getElementById('input-mileage').value) || d.mileage;
    const date = document.getElementById('input-date').value || d.serviceDate;
    const svcMi = parseInt(document.getElementById('input-service-mileage').value) || mi;
    persist({ mileage: mi, serviceDate: date, serviceMileage: svcMi });
    closeModal(); render();
  }

  render();
</script>
</body>
</html>
